function element(tag, text) {
  const node = document.createElement(tag);
  node.textContent = text;
  return node;
}
const children = {
  Drag: ['Cols'],
  Accordion: ['AccordionItem'],
  AccordionItem: ['AccordionTrigger', 'AccordionContent'],
  Slider: ['SliderButton', 'SliderPagination'],

const byName = new Map(entries.map(entry => [entry[1], entry]));
const nested = new Set(Object.values(children).flat());
const related = {
  List: ['Heading', 'Text', 'Image'],
  Area: ['Heading', 'Text', 'Image', 'Buttons'],
};
function linkTo(name) {
  const link = element('a', name);
  link.href = '#' + name;
  return link;
}
function example(snippet) {
  const pre = element('pre', '');
  const code = element('code', '');
  const tokens = /(<\/?)([A-Z][\w.]*)|("[^"]*"|'[^']*')|([\w]+)(?==)|([{}])/g;
  let offset = 0;
  for (const match of snippet.matchAll(tokens)) {
    code.append(snippet.slice(offset, match.index));
    const token = element('span', match[0]);
    token.className = match[2] ? 'syntax-tag' : match[3] ? 'syntax-string' : match[4] ? 'syntax-prop' : 'syntax-brace';
    code.append(token);
    offset = match.index + match[0].length;
  }
  code.append(snippet.slice(offset));
  pre.append(code);
  const copy = element('button', 'Копировать JSX');
  copy.type = 'button';
  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(snippet);
      copy.textContent = 'Скопировано';
    } catch {
      const range = document.createRange();
      range.selectNodeContents(pre);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      copy.textContent = 'Код выделен';
    }
  });
  const panel = element('div', '');
  panel.className = 'code-panel';
  const toolbar = element('div', '');
  toolbar.className = 'code-toolbar';
  toolbar.append(element('span', 'JSX'), copy);
  panel.append(toolbar, pre);
  return panel;
}
const commonPropNotes = {

function referenceTable(rows, title, id, isProps) {
  const panel = element('section', '');
  panel.className = 'reference-section';
  panel.id = id;
  const heading = element('h2', title);
  heading.id = id + '-title';
  const frame = element('div', '');
  frame.className = 'settings';
  frame.tabIndex = 0;
  frame.setAttribute('role', 'region');
  frame.setAttribute('aria-labelledby', heading.id);
  const table = element('table', '');
  table.setAttribute('aria-labelledby', heading.id);
  const labels = ['Параметр', 'Тип', 'По умолчанию', 'Что меняет'];
  const head = element('thead', '');
  const header = element('tr', '');
  for (const label of labels) {
    const cell = element('th', label);
    cell.scope = 'col';
    header.append(cell);
  }
  head.append(header);
  const body = element('tbody', '');
  for (const [prop, type, initial, description, required] of rows) {
    const row = element('tr', '');
    const key = element('th', '');
    key.scope = 'row';
    key.append(element(isProps ? 'code' : 'span', prop));
    if (required) {
      const badge = element('small', 'Обязательный');
      badge.className = 'required';
      key.append(badge);
    }
    row.append(key);
    for (const [i, value] of [type, initial, description].entries()) {
      const cell = element('td', '');
      cell.dataset.label = labels[i + 1];
      cell.append(element(i === 0 && isProps ? 'code' : 'span', value));
      row.append(cell);
    }
    body.append(row);
  }
  table.append(head, body);
  frame.append(table);
  panel.append(heading, frame);
  return panel;
}
function propsTable(name) {
  const signatures = jsxProps[name] ?? [];
  const docs = settings[name] ?? [];
  const props = new Map();
  for (const [prop, type, optional] of signatures.flat()) {
    const prior = props.get(prop);
    props.set(prop, prior ? [[...new Set([...prior[0], type])], prior[1] || optional] : [[type], optional]);
  }
  const rows = [...props].sort(([a, [, ao]], [b, [, bo]]) => Number(ao) - Number(bo)
    || Number(a in commonPropNotes) - Number(b in commonPropNotes)).map(([prop, [types, optional]]) => {
    const match = docs.find(([label, type]) => type !== 'Gutenberg' && label.split(' / ').includes(prop));
    const fallback = match && (!match[0].includes(' / ') || match[2] === 'false') ? match[2] : '—';
    return [prop, types.join(' | '), splitDefaults[name]?.[prop] ?? fallback, match?.[3] ?? commonPropNotes[prop] ?? '—', !optional];
  });
  return rows.length ? referenceTable(rows, 'JSX-пропсы · ' + rows.length, name + '-props', true) : null;
}
function usagePanel(name) {
  const scenario = usage[name];
  if (!scenario) return null;
  const panel = element('section', '');
  panel.className = 'usage reference-section';
  panel.id = name + '-usage';
  panel.append(element('h2', 'Пример использования'), element('h3', scenario.title), element('p', scenario.description));
  if (scenario.link) panel.append(linkTo(scenario.link));
  if (scenario.code) panel.append(example(scenario.code));
  return panel;
}
function card(name, parent) {
  const [, , field, description] = byName.get(name);
  const node = element(parent ? 'details' : 'article', '');
  const title = element(parent ? 'summary' : 'h1', '');
  title.append(parent ? document.createTextNode(name) : linkTo(name));
  node.id = name;
  const badge = element('small', field);
  badge.className = 'field-label';
  const intro = element('p', description);
  intro.className = 'component-intro';
  node.append(title, badge, intro);
  const props = propsTable(name);
  const controls = (settings[name] ?? []).filter(([key, type]) => type === 'Gutenberg' ||
    !key.split(' / ').some(prop => (jsxProps[name] ?? []).flat().some(([known]) => known === prop)));
  const editor = controls.length ? referenceTable(controls, 'В редакторе Gutenberg', name + '-editor', false) : null;
  const scenario = usagePanel(name);
  const sections = [[name + '-syntax', 'Синтаксис'], ...(props ? [[props.id, 'JSX-пропсы']] : []),
    ...(editor ? [[editor.id, 'В редакторе']] : []), ...(scenario ? [[scenario.id, 'Пример']] : []),
    ...(children[name] ? [[name + '-children', 'Дочерние']] : [])];
  if (!parent) {
    const nav = element('nav', '');
    nav.className = 'page-links';
    nav.setAttribute('aria-label', 'На этой странице');
    for (const [id, label] of sections) {
      const link = element('a', label);
      link.href = '#' + id;
      nav.append(link);
    }
    node.append(nav);
  }
  const syntax = example(examples[name] ?? '<' + name + ' />');
  syntax.id = name + '-syntax';
  node.append(syntax);
  if (props) node.append(props);
  if (editor) node.append(editor);
  if (scenario) node.append(scenario);
  if (related[name]) {
    const note = element('p', 'Примеры полей внутри: ');
    related[name].forEach((child, index) => note.append(index ? ', ' : '', linkTo(child)));
    node.append(note);
  }
  if (children[name]) {
    const section = element('div', '');
    section.className = 'children reference-section';
    section.id = name + '-children';
    section.append(element('h4', 'Дочерние компоненты'));
    for (const child of children[name]) section.append(card(child, name));
    node.append(section);
  }
  return node;
}
const parents = new Map(Object.entries(children).flatMap(([parent, parts]) =>
  parts.map(part => [part, parent])));
function topLevel(name) {
  while (parents.has(name)) name = parents.get(name);
  return name;
}
function appendNavigation(nav, name, selected, depth = 0) {
  const item = linkTo(name);
  item.style.setProperty('--depth', depth);
  if (name === selected) item.setAttribute('aria-current', 'location');
  nav.append(item);
  if (topLevel(selected) === topLevel(name)) {
    for (const child of children[name] ?? []) appendNavigation(nav, child, selected, depth + 1);
  }
}
function render({ followHash = false } = {}) {
  const term = search.value.trim().toLocaleLowerCase('ru');
  const matches = name => [...byName.get(name), ...(settings[name] ?? []).flat(), ...(jsxProps[name] ?? []).flat(2)].join(' ').toLocaleLowerCase('ru').includes(term)
    || (children[name] ?? []).some(matches);
  const visible = entries.filter(([category, name]) => !nested.has(name)
    && (!group.value || category === group.value) && matches(name));
  const anchor = location.hash.slice(1);
  const requested = anchor.split('-')[0];
  const selected = visible.some(entry => entry[1] === topLevel(requested)) ? requested : visible[0]?.[1];
  status.textContent = selected ? '' : 'Компоненты не найдены. Попробуйте изменить запрос или группу.';
  catalog.replaceChildren();
  toc.replaceChildren();

  for (const label of groups) {
    const matching = visible.filter(entry => entry[0] === label);
    if (!matching.length) continue;
    const heading = element('h3', label);
    heading.className = 'nav-group';
    toc.append(heading);
    for (const [, name] of matching) appendNavigation(toc, name, selected);
  }
  if (!selected) return;
  const root = topLevel(selected);
  catalog.append(card(root, null));

  const target = document.getElementById(selected);
  for (let node = target; node && node !== catalog; node = node.parentElement) {
    if (node.tagName === 'DETAILS') node.open = true;
  }
  const destination = document.getElementById(anchor);
  if (followHash && (selected !== root || destination && destination !== target || matchMedia('(max-width: 45rem)').matches)) (destination ?? target)?.scrollIntoView();
  else if (followHash) window.scrollTo(0, 0);
  if (followHash) toc.querySelector('[aria-current]')?.scrollIntoView({ block: 'nearest', container: 'nearest' });
}
window.addEventListener('hashchange', () => {
  const name = location.hash.slice(1).split('-')[0];
  if (name && ![...toc.querySelectorAll('a')].some(link => link.hash === '#' + name || link.hash === '#' + topLevel(name))) {
    search.value = '';
    group.value = '';
  }
  render({ followHash: true });
});
document.addEventListener('click', event => {
  const link = event.target.closest('a[href^="#"]');
  const target = link?.closest('.page-links') && document.getElementById(link.hash.slice(1));
  if (!target || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  event.preventDefault();
  if (location.hash !== link.hash) history.pushState(null, '', link.hash);
  target.tabIndex = -1;
  target.focus({ preventScroll: true });
  target.scrollIntoView();
});
document.addEventListener('keydown', event => {

});
search.addEventListener('keydown', event => {
  if (event.key === 'Escape') { search.value = ''; render(); }
  if (event.key === 'Enter') toc.querySelector('a')?.click();
});
search.addEventListener('input', () => render());
group.addEventListener('change', () => render());
render({ followHash: Boolean(location.hash) });
</script>
</body>
</html>
